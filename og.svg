<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Parrish Projects systems studio">
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332718"/>
      <stop offset="0.48" stop-color="#17120D"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <radialGradient id="pp-glow" cx="70%" cy="24%" r="70%">
      <stop offset="0" stop-color="#EB4D22" stop-opacity="0.30"/>
      <stop offset="0.46" stop-color="#EB4D22" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#EB4D22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pp-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#B8350F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#F3EEE4"/>
  <g fill="none" stroke="#D6CDBC" stroke-width="1" opacity="0.85">
    <circle cx="930" cy="315" r="220" stroke-dasharray="3 8"/>
