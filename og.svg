  </g>
  <image href="og-logo-clean.png" x="800" y="164" width="276" height="276" preserveAspectRatio="xMidYMid meet"/>
  <text x="90" y="200" font-family="Georgia, serif" font-size="36" fill="#837C70">Parrish Projects, Custom software studio</text>
  <text x="86" y="320" font-family="Georgia, serif" font-size="104" fill="#16130E">We build the</text>
  <text x="86" y="430" font-family="Georgia, serif" font-size="104" fill="#16130E">systems your</text>
  <text x="86" y="540" font-family="Georgia, serif" font-size="104" fill="#16130E">business <tspan font-style="italic" fill="#B8350F">runs on.</tspan></text>
</svg>
